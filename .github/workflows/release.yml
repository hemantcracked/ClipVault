name: Build & Publish ClipVault APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            python3 -c '
          import base64, os, re, sys
          s = re.sub(r"-----.*?-----|\s+", "", os.environ["KEYSTORE_BASE64"])
          try:
              d = base64.b64decode(s, validate=True)
          except Exception as e:
              print(f"ERROR: KEYSTORE_BASE64 is not valid Base64 (length={len(s)} chars): {e}")
              print("Tip: A .jks Base64 string is usually ~3000-4000 chars long (not a file path).")
              sys.exit(1)
          open("release.jks", "wb").write(d)
          print(f"Decoded release.jks successfully ({len(d)} bytes)")
          '
            echo "KEYSTORE_FILE=${{ github.workspace }}/release.jks" >> "$GITHUB_ENV"
          fi
